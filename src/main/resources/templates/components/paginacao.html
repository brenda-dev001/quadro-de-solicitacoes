<nav th:fragment="paginacao(pagina)" th:if="${pagina.numeroPaginas > 1}" class="pagination" aria-label="Paginação" xmlns:th="http://www.thymeleaf.org">
    <a th:if="${not pagina.primeira}" th:href="${pagina.urlParaPagina(0)}" th:hx-get="${pagina.urlParaPagina(0)}" hx-push-url="true" aria-label="Primeira página">
        «
    </a>
    <span th:if="${pagina.primeira}" aria-hidden="true">
        «
    </span>
    <a th:if="${not pagina.primeira}" th:href="${pagina.urlParaPagina(pagina.atual - 1)}" th:hx-get="${pagina.urlParaPagina(pagina.atual - 1)}" hx-push-url="true" aria-label="Página anterior">
        ‹
    </a>
    <span th:if="${pagina.primeira}" aria-hidden="true">
        ‹
    </span>
    <a th:each="numero : ${#numbers.sequence(pagina.inicio, pagina.fim)}" th:text="${numero}" th:href="${pagina.urlParaPagina(numero - 1)}" th:hx-get="${pagina.urlParaPagina(numero - 1)}" hx-push-url="true" th:attr="aria-current=${numero == pagina.atual + 1 ? 'page' : null}, aria-label=${'Página ' + numero}">
    </a>
    <a th:if="${not pagina.ultima}" th:href="${pagina.urlParaPagina(pagina.atual + 1)}" th:hx-get="${pagina.urlParaPagina(pagina.atual + 1)}" hx-push-url="true" aria-label="Próxima página">
        ›
    </a>
    <span th:if="${pagina.ultima}" aria-hidden="true">
        ›
    </span>
    <a th:if="${not pagina.ultima}" th:href="${pagina.urlParaPagina(pagina.numeroPaginas - 1)}" th:hx-get="${pagina.urlParaPagina(pagina.numeroPaginas - 1)}" hx-push-url="true" aria-label="Última página">
        »
    </a>
    <span th:if="${pagina.ultima}" aria-hidden="true">
        »
    </span>
</nav>
<th th:fragment="coluna(pagina, propriedade, texto, classe)" scope="col" th:classappend="${classe}" xmlns:th="http://www.thymeleaf.org" th:attr="aria-sort=${pagina.ordenada(propriedade) ? (pagina.isAscendente(propriedade) ? 'ascending' : 'descending') : 'none'}">
    <a th:href="${pagina.urlInvertendoDirecaoOrdem(propriedade)}" th:hx-get="${pagina.urlInvertendoDirecaoOrdem(propriedade)}" hx-push-url="true" class="inline-flex">
        <span th:text="${texto}">
        </span>
        <span th:if="${pagina.ordenada(propriedade)}" th:text="${pagina.isAscendente(propriedade) ? '↑' : '↓'}" aria-hidden="true">
        </span>
    </a>
</th>
