<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <title layout:title-pattern="$LAYOUT_TITLE - $CONTENT_TITLE">
            Quadro de Solicitações
        </title>
        <!-- Estilo Principal do Template -->
        <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
        <!-- Estilo do MDDateTimePicker -->
        <link rel="stylesheet" type="text/css" th:href="@{/css/vendors/mddatetimepicker/mdDateTimePicker.min.css}" />
        <!-- Estilo do MCDatepicker -->
        <link rel="stylesheet" type="text/css" th:href="@{/css/vendors/mcdatepicker/mc-calendar.min.css}" />
        <!-- Estilo do SweetAlert2 -->
        <link rel="stylesheet" type="text/css" th:href="@{/css/vendors/sweetalert2/sweetalert2.min.css}" />
        <!-- Biblioteca Alpine.js usada no Menu -->
        <script defer th:src="@{/js/vendors/alpinejs/cdn.min.js}">
        </script>
        </script>
        <!-- Biblioteca htmx -->
        <script defer th:src="@{/js/vendors/htmx/htmx.min.js}">
        </script>
        <meta name="htmx-config" content='{"defaultSwap":"outerHTML"}'>
        <!-- Biblioteca SimpleMaskMoney -->
        <script th:src="@{/js/vendors/maskmoney/simple-mask-money.umd.min.js}" defer>
        </script>
        <!-- Biblioteca MCDatepicker -->
        <script th:src="@{/js/vendors/mcdatepicker/mc-calendar.min.js}" defer>
        </script>
        <!-- Biblioteca MDDateTimePicker -->
        <script th:src="@{/js/vendors/mddatetimepicker/draggabilly.pkgd.min.js}" defer>
        </script>
        <script th:src="@{/js/vendors/mddatetimepicker/moment.min.js}" defer>
        </script>
        <script th:src="@{/js/vendors/mddatetimepicker/mdDateTimePicker.js}" defer>
        </script>
        <!-- Biblioteca SweetAlert2 -->
        <script th:src="@{/js/vendors/sweetalert2/sweetalert2.all.min.js}" defer>
        </script>
        <!-- Aplicação Principal (Global) -->
        <script th:src="@{/js/app.js}" defer>
        </script>
        <meta name="_csrf" th:content="${_csrf?.token}" />
        <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
        <script defer th:src="@{/js/interface.js}">
        </script>
    </head>
    <body class="app" hx-target:inherited="#main" hx-status:inherited:4xx="target:#main" hx-status:inherited:5xx="target:#main">
        <a href="#main" class="skip-link">
            Ir para o conteúdo
        </a>
        <div th:replace="~{layout/fragments/sidebar :: sidebar}">
        </div>
        </button>
        <div class="workspace">
            <div th:replace="~{layout/fragments/header :: header}">
            </div>
            <th:block layout:fragment="conteudo">
            </th:block>
            <div th:replace="~{layout/fragments/rodape :: rodape}">
            </div>
        </div>
        <th:block layout:fragment="scripts">
        </th:block>
    </body>
</html>
