<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org"
    layout:decorate="~{layout/layoutpadrao}">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>Detalhes da Solicitação</title>
</head>
<body>
    <main layout:fragment="conteudo" th:fragment="conteudo" id="main" class="flex flex-col align-middle w-full m-10">
        <h3 class="text-xl md:text-3xl mt-3 ms-5">Detalhes da Solicitação</h3>

        <section class="w-1/2 mt-6 ms-5" th:object="${solicitacao}">
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Código', textoExibicao=*{id})}"></div>
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Descrição', textoExibicao=*{descricao})}"></div>
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Situação', textoExibicao=*{status})}"></div>
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Abertura', textoExibicao=${#temporals.format(solicitacao.dataCriacao, 'dd/MM/yyyy HH:mm')})}"></div>
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Categoria', textoExibicao=*{nomeCategoria})}"></div>
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Funcionário', textoExibicao=*{nomeSolicitante})}"></div>
            <div th:replace="~{components/forms :: campoEstatico(textoLabel='Técnico', textoExibicao=${solicitacao.nomeTecnico ?: 'Não atribuído'})}"></div>
        </section>
        <section class="w-1/2 mt-6 ms-5">
            <div th:object="${solicitacaoAtendimentoRequest}"><div th:replace="~{solicitacoes/fragments/erros :: erros}"></div></div>
            <div th:object="${solicitacaoCancelamentoRequest}"><div th:replace="~{solicitacoes/fragments/erros :: erros}"></div></div>
            <div th:object="${comentarioCreateRequest}"><div th:replace="~{solicitacoes/fragments/erros :: erros}"></div></div>

            <form th:if="${solicitacao.status == T(com.quadrosolicitacoes.solicitacao.StatusSolicitacao).ABERTA}"
                th:hx-post="@{/solicitacoes/{id}/assumir(id=${solicitacao.id})}" th:object="${solicitacaoAtendimentoRequest}">
                <div th:replace="~{components/forms :: inputBuscavel(
                textoLabel='Técnico', nomeAtributo='tecnicoId', nomeAtributoTexto='nomeTecnico',
                placeholderBusca='Digite o nome para buscar...', urlBusca='/solicitacoes/pesquisartecnico',
                valorAtributo=*{tecnicoId}, valorAtributoTexto=*{nomeTecnico}, isValidado=true)}"></div>
                <button type="submit" class="mt-5 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200 disabled:opacity-50 disabled:pointer-events-none">Iniciar atendimento</button>
            </form>
            <form th:if="${solicitacao.status == T(com.quadrosolicitacoes.solicitacao.StatusSolicitacao).EM_ANDAMENTO}"
                th:hx-post="@{/solicitacoes/{id}/concluir(id=${solicitacao.id})}" th:object="${solicitacaoAtendimentoRequest}">
                <div th:replace="~{components/forms :: inputBuscavel(
                textoLabel='Técnico responsável', nomeAtributo='tecnicoId', nomeAtributoTexto='nomeTecnico',
                placeholderBusca='Digite o nome para buscar...', urlBusca='/solicitacoes/pesquisartecnico',
                valorAtributo=*{tecnicoId}, valorAtributoTexto=*{nomeTecnico}, isValidado=true)}"></div>
                <button type="submit" hx-confirm="Você vai concluir esta solicitação!" class="mt-5 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200 disabled:opacity-50 disabled:pointer-events-none">Concluir</button>
            </form>
            <form th:if="${solicitacao.status == T(com.quadrosolicitacoes.solicitacao.StatusSolicitacao).ABERTA}"
                th:hx-post="@{/solicitacoes/{id}/cancelar(id=${solicitacao.id})}" th:object="${solicitacaoCancelamentoRequest}">
                <input type="hidden" th:field="*{solicitanteId}" />
                <p th:errors="*{solicitanteId}" class="text-sm text-red-600 mt-2"></p>
                <button type="submit" hx-confirm="Você vai cancelar esta solicitação!" class="mt-5 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200 disabled:opacity-50 disabled:pointer-events-none">Cancelar solicitação</button>
            </form>
        </section>
        <section class="mt-10 ms-5">
            <h4 class="text-xl">Comentários</h4>
            <p th:if="${pagina.vazia}" class="text-gray-500 mt-5">Nenhum comentário cadastrado.</p>
            <div th:each="comentario : ${pagina.conteudo}" class="border rounded-xl p-4 mt-5">
                <p class="font-medium" th:text="${comentario.nomeAutor}"></p>
                <p class="text-sm text-gray-500" th:text="${#temporals.format(comentario.dataCriacao, 'dd/MM/yyyy HH:mm')}"></p>
                <p class="mt-3 whitespace-pre-wrap" th:text="${comentario.conteudo}"></p>
            </div>
            <div th:if="${not pagina.vazia}" th:insert="~{components/paginacao :: paginacao(${pagina})}"></div>
            <form th:if="${solicitacao.status == T(com.quadrosolicitacoes.solicitacao.StatusSolicitacao).ABERTA
                    or solicitacao.status == T(com.quadrosolicitacoes.solicitacao.StatusSolicitacao).EM_ANDAMENTO}"
                th:hx-post="@{/solicitacoes/{id}/comentarios(id=${solicitacao.id})}"
                th:object="${comentarioCreateRequest}" class="w-1/2 mt-6">
                <div th:replace="~{components/forms :: inputBuscavel(
                textoLabel='Autor', nomeAtributo='autorId', nomeAtributoTexto='nomeAutor',
                placeholderBusca='Digite o nome para buscar...', urlBusca=@{/solicitacoes/{id}/pesquisarautor(id=${solicitacao.id})},
                valorAtributo=*{autorId}, valorAtributoTexto=*{nomeAutor}, isValidado=true)}"></div>
                <div th:replace="~{components/forms :: inputTextArea(textoLabel='Comentário', nomeAtributo='conteudo', isValidado=true)}"></div>
                <button type="submit" class="mt-5 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200 disabled:opacity-50 disabled:pointer-events-none">Comentar</button>
            </form>
            <a th:hx-get="@{/solicitacoes}" hx-push-url="true" class="cursor-pointer text-blue-600 mt-5 inline-block">Voltar para a pesquisa</a>
        </section>

    </main>
</body>
</html>
