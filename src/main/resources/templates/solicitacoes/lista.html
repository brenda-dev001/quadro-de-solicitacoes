<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org" layout:decorate="~{layout/layoutpadrao}">
    <head>
        <meta charset="UTF-8"/>
        <title>
            Solicitações
        </title>
    </head>
    <body>
        <main id="main" class="page" tabindex="-1" layout:fragment="conteudo" th:fragment="conteudo">
            <header class="page-heading">
                <div>
                    <p class="eyebrow">
                        QUADRO DE SOLICITAÇÕES
                    </p>
                    <h1>
                        Solicitações
                    </h1>
                    <p class="page-description">
                        Acompanhe cada pedido, do registro à conclusão.
                    </p>
                </div>
                <a th:href="@{/solicitacoes/nova}" th:hx-get="@{/solicitacoes/nova}" hx-push-url="true" class="btn btn-primary">
                    <svg th:replace="~{components/icones :: icone('mais')}">
                    </svg>
                    Nova solicitação
                </a>
            </header>
            <section class="panel filter-panel">
                <div class="panel-heading">
                    <div>
                        <h2>
                            <svg th:replace="~{components/icones :: icone('busca')}">
                            </svg>
                            Filtrar solicitações
                        </h2>
                        <p>
                            Use um ou mais campos para encontrar o que precisa.
                        </p>
                    </div>
                </div>
                <form th:hx-get="@{/solicitacoes}" th:object="${solicitacaoSearchRequest}" class="filter-body" data-validate="pesquisa">
                    <input type="hidden" name="pesquisa" value="true"/>
                    <div th:replace="~{solicitacoes/fragments/erros :: erros}">
                    </div>
                    <div class="filter-grid">
                        <div class="filter-field filter-code" th:insert="~{components/forms :: inputNumero(textoLabel='Código', nomeAtributo='id', isValidado=true, showGroups=false, placeholder='Ex.: 12')}">
                        </div>
                        <div class="filter-field filter-description-wide" th:insert="~{components/forms :: inputTexto(textoLabel='Descrição', nomeAtributo='descricao', isValidado=true, tamanhoMaximo=5000, placeholder='O que você procura?')}">
                        </div>
                        <div class="filter-field filter-status" th:insert="~{components/forms :: selectNormal(textoLabel='Situação', nomeAtributo='status', listaOpcoes=${situacoes}, propLabel='descricao', isValidado=true, textoPlaceholder='Todas as situações')}">
                        </div>
                        <div class="filter-field filter-select" th:insert="~{components/forms :: inputBuscavel(textoLabel='Categoria', nomeAtributo='categoriaId', nomeAtributoTexto='nomeCategoria', urlBusca='/solicitacoes/pesquisarcategoria', placeholderBusca='Digite para filtrar as opções', valorAtributo=*{#object?.categoriaId}, valorAtributoTexto=*{#object?.nomeCategoria}, isValidado=true)}">
                        </div>
                        <div class="filter-field filter-select" th:insert="~{components/forms :: inputBuscavel(textoLabel='Funcionário', nomeAtributo='solicitanteId', nomeAtributoTexto='nomeSolicitante', urlBusca='/solicitacoes/pesquisarfuncionario', placeholderBusca='Digite para filtrar as opções', valorAtributo=*{#object?.solicitanteId}, valorAtributoTexto=*{#object?.nomeSolicitante}, isValidado=true)}">
                        </div>
                        <div class="filter-field filter-select" th:insert="~{components/forms :: inputBuscavel(textoLabel='Técnico', nomeAtributo='tecnicoId', nomeAtributoTexto='nomeTecnico', urlBusca='/solicitacoes/pesquisartecnico', placeholderBusca='Digite para filtrar as opções', valorAtributo=*{#object?.tecnicoId}, valorAtributoTexto=*{#object?.nomeTecnico}, isValidado=true)}">
                        </div>
                    </div>
                    <div class="filter-actions">
                        <a th:href="@{/solicitacoes}" th:hx-get="@{/solicitacoes}" hx-push-url="true" class="btn btn-ghost">
                            Limpar filtros
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <svg th:replace="~{components/icones :: icone('busca')}">
                            </svg>
                            Pesquisar
                        </button>
                    </div>
                </form>
            </section>
            <section class="panel results-panel">
                <div class="panel-heading">
                    <div>
                        <h2>
                            Todas as solicitações
                        </h2>
                        <p th:text="${pagina.totalElementos} + ' registro(s)'">
                        </p>
                    </div>
                    <span class="count-label" th:if="${not pagina.vazia}" th:text="'Página ' + (${pagina.atual} + 1) + ' de ' + ${pagina.numeroPaginas}">
                    </span>
                </div>
                <div th:if="${pagina.vazia and not pesquisaInvalida}" class="empty-state">
                    <span class="empty-icon">
                        <svg th:replace="~{components/icones :: icone('busca')}">
                        </svg>
                    </span>
                    <h3 th:text="${pesquisaRealizada ? 'Nenhuma solicitação encontrada' : 'Nenhuma solicitação cadastrada'}"></h3>
                    <p th:text="${pesquisaRealizada ? 'Tente ajustar os filtros para encontrar o que procura.' : 'Cadastre uma solicitação para começar. Os registros aparecerão aqui.'}"></p>
                    <a th:href="@{/solicitacoes/nova}" th:hx-get="@{/solicitacoes/nova}" hx-push-url="true" class="btn btn-secondary">
                        Cadastrar solicitação
                    </a>
                </div>
                <div class="table-scroll" th:if="${not pagina.vazia}">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th:block th:replace="~{components/paginacao :: coluna(${pagina}, 'id', 'Código', '')}">
                                </th:block>
                                <th>
                                    Solicitação
                                </th>
                                <th:block th:replace="~{components/paginacao :: coluna(${pagina}, 'status', 'Situação', '')}">
                                </th:block>
                                <th>
                                    Responsáveis
                                </th>
                                <th:block th:replace="~{components/paginacao :: coluna(${pagina}, 'dataCriacao', 'Abertura', '')}">
                                </th:block>
                                <th class="align-right">
                                    Ação
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="solicitacao : ${pagina.conteudo}">
                                <td>
                                    <span class="record-code" th:text="'#' + ${solicitacao.id}">
                                    </span>
                                </td>
                                <td class="cell-summary">
                                    <span class="cell-title clamp-two" th:text="${solicitacao.descricao}">
                                    </span>
                                    <span class="cell-caption" th:text="${solicitacao.nomeCategoria}">
                                    </span>
                                </td>
                                <td>
                                    <span th:replace="~{components/situacao :: situacao(${solicitacao.status})}">
                                    </span>
                                </td>
                                <td>
                                    <span class="cell-title" th:text="${solicitacao.nomeSolicitante}">
                                    </span>
                                    <span class="cell-caption" th:text="${solicitacao.nomeTecnico ?: 'Técnico não atribuído'}">
                                    </span>
                                </td>
                                <td class="cell-date" th:text="${#temporals.format(solicitacao.dataCriacao, 'dd/MM/yyyy HH:mm')}">
                                </td>
                                <td class="align-right">
                                    <a th:href="@{/solicitacoes/{id}(id=${solicitacao.id})}" th:hx-get="@{/solicitacoes/{id}(id=${solicitacao.id})}" hx-push-url="true" class="btn btn-secondary btn-small">
                                        Detalhes
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="pagination-container" th:if="${not pagina.vazia}">
                    <div th:replace="~{components/paginacao :: paginacao(${pagina})}">
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
