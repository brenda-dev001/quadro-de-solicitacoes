<div th:fragment="erros" xmlns:th="http://www.thymeleaf.org" th:if="${#fields.hasAnyErrors()}" class="alert-error" role="alert" tabindex="-1">
    <strong>
        Confira os dados informados.
    </strong>
    <ul>
        <li th:each="erro : ${#fields.allErrors()}" th:text="${erro}">
        </li>
    </ul>
</div>
