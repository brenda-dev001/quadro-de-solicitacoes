<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.thymeleaf.org"
    layout:decorate="~{layout/layoutpadrao}">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
    <title>Pesquisa de Categorias</title>
</head>

<body>
    <!-- conteudo principal -->
    <main layout:fragment="conteudo" th:fragment="conteudo" id="main" class="flex flex-col align-middle w-full m-10">

        <h3 class="text-xl md:text-3xl mt-3 ms-5">Pesquisa de Categorias</h3>

        <form th:hx-get="@{/categorias}" th:object="${categoriaSearchRequest}" class="w-1/2 mt-6 ms-5">

            <div class="flex gap-15">
                <div>
                    <div th:replace="~{components/forms :: inputNumero(
                        textoLabel='Código',
                        nomeAtributo='id',
                        valorAtributo=*{id},
                        showGroups=true)}"></div>
                </div>

                <div>
                    <div th:replace="~{components/forms :: inputTexto(
                        textoLabel='Nome',
                        nomeAtributo='nome',
                        valorAtributo=*{nome})}"></div>
                </div>

                <div>
                    <div th:replace="~{components/forms :: inputTexto(
                        textoLabel='Descrição',
                        nomeAtributo='descricao',
                        valorAtributo=*{descricao})}"></div>
                </div>
            </div>

            <button type="submit"
                class="mt-5 py-3 px-4 inline-flex items-center gap-x-2 text-sm font-medium rounded-lg border border-transparent bg-blue-100 text-blue-800 hover:bg-blue-200 focus:outline-none focus:bg-blue-200 disabled:opacity-50 disabled:pointer-events-none">Pesquisar</button>

        </form>

        <div th:if="${not pagina.vazia}" class="flex flex-col w-full ml-5 mr-16 mt-5">
            <div class="overflow-x-auto">
                <div class="min-w-full inline-block align-middle">
                    <div class="border rounded-xl overflow-hidden shadow">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead>
                                <tr>
                                    <th:block
                                        th:replace="~{components/paginacao :: coluna(${pagina}, 'id', 'Código', '')}">
                                    </th:block>
                                    <th:block
                                        th:replace="~{components/paginacao :: coluna(${pagina}, 'nome', 'Nome', '')}">
                                    </th:block>
                                    <th scope="col"
                                        class="px-6 py-3 text-start text-xs font-medium text-gray-500 uppercase">
                                        Descrição
                                    </th>
                                    <th scope="col" colspan="2"
                                        class="px-6 py-3 text-end text-xs font-medium text-gray-500 uppercase">Ação
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="categoria : ${pagina.conteudo}"
                                    class="odd:bg-white even:bg-gray-100 hover:bg-gray-200">
                                    <td th:text="${categoria.id}"
                                        class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-800">John Brown
                                    </td>
                                    <td th:text="${categoria.nome}"
                                        class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">45</td>
                                    <td th:text="${categoria.descricao}"
                                        class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">New York No. 1 Lake
                                        Park</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-end text-sm font-medium">
                                        <a th:hx-get="@{/categorias/{id}/editar(id=${categoria.id})}"
                                        hx-push-url="true" class="cursor-pointer text-blue-600 hover:text-blue-500 decoration-2 hover:underline focus:outline-hidden focus:underline">Alterar</a>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-end text-sm font-medium">
                                        <button type="button"
                                            th:hx-delete="@{/categorias/{id}(id=${categoria.id})}"
                                            th:hx-confirm="${'Você vai remover a categoria ' + categoria.nome + '!'}"
                                            class="text-red-600 hover:text-red-500 decoration-2 hover:underline focus:outline-hidden focus:underline cursor-pointer bg-transparent border-0 p-0 inline">Remover</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{components/paginacao :: paginacao(${pagina})}"></div>
                </div>
            </div>
        </div>

    </main>
    <!-- !conteudo principal -->
</body>

</html>
