<th:block th:fragment="lista" xmlns:th="http://www.thymeleaf.org">
    <li th:if="${#lists.isEmpty(categorias)}" class="p-2 text-gray-500 italic cursor-default pointer-events-none">
        Nenhuma categoria encontrada.
    </li>

    <li th:each="categoria : ${categorias}" class="p-2 hover:bg-gray-100 cursor-pointer" 
        th:data-value="${categoria.id}" 
        th:data-text="${categoria.nome}" 
        th:text="${categoria.nome}">
    </li>
</th:block>
